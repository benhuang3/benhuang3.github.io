<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.author }} - {{ site.role }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/modern.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body>
    <!-- Switch to retro -->
    <a class="style-toggle" href="{{ '/retro.html' | relative_url }}" id="style-toggle">
        <span class="toggle-icon">&#127760;</span>
        <span class="toggle-label">Retro</span>
    </a>

    <!-- Banner -->
    <header class="banner">
        <div class="banner-content">
            <h1>{{ site.author }}</h1>
            <p>{{ site.role }}</p>
            <a href="#projects" class="banner-cta">
                <span>View My Work</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 17L17 7M17 7H7M17 7V17"/>
                </svg>
            </a>
        </div>
    </header>

    <!-- Projects -->
    <main class="main-content">
        {{ content }}
    </main>

    <script src="{{ '/assets/js/modern.js' | relative_url }}"></script>
</body>
</html>
