<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben Huang</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #e6edf3;
        }

        .landing {
            text-align: center;
            padding: 40px 20px;
        }

        .landing h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .landing p {
            color: #8b949e;
            font-size: 1.1rem;
            margin-bottom: 48px;
        }

        .choices {
            display: flex;
            gap: 32px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .choice {
            display: block;
            width: 260px;
            padding: 32px 24px;
            border-radius: 12px;
            text-decoration: none;
            color: #e6edf3;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .choice:hover {
            transform: translateY(-4px);
        }

        .choice-retro {
            background: linear-gradient(135deg, #1a1a4e 0%, #2d1a4e 100%);
            border: 2px solid #5544aa;
        }

        .choice-retro:hover {
            box-shadow: 0 8px 30px rgba(85, 68, 170, 0.4);
        }

        .choice-modern {
            background: linear-gradient(135deg, #0d2137 0%, #0a2a1a 100%);
            border: 2px solid #238636;
        }

        .choice-modern:hover {
            box-shadow: 0 8px 30px rgba(35, 134, 54, 0.4);
        }

        .choice-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }

        .choice h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .choice .desc {
            font-size: 0.9rem;
            color: #8b949e;
        }

        .remember {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #484f58;
        }
    </style>
</head>
<body>
    <div class="landing">
        <h1>Ben Huang</h1>
        <p>What is the purpose of your visit?</p>

        <div class="choices">
            <a class="choice choice-retro" href="/modern.html" onclick="localStorage.setItem('siteMode','retro')">
                <h2>Business</h2>
            </a>

            <a class="choice choice-modern" href="/retro.html" onclick="localStorage.setItem('siteMode','modern')">
                <h2>Fun</h2>
            </a>
        </div>

        <p class="remember">Switch at any time. This site does not store cookies</p>
    </div>
</body>
</html>
